<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>カラオケ配信チェック</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap fade-in">
    <h1>🎤 カラオケ配信チェック</h1>
    <p>調べたい曲名を入力してください</p>
    <div class="search-area">
      <input type="text" id="song" placeholder="曲名を入力" />
      <button id="searchBtn" class="pulse">検索</button>
    </div>
    <div id="result" class="slide-up"></div>
  </div>

  <script>
    document.getElementById("searchBtn").addEventListener("click", () => {
      const song = document.getElementById("song").value.trim();
      const result = document.getElementById("result");
      if (!song) {
        result.innerHTML = "⚠️ 曲名を入力してください。";
        return;
      }
      result.innerHTML = `
        <p>🔍「${song}」の検索結果リンク:</p>
        <ul>
          <li><a href="https://www.clubdam.com/karaokesearch/song/?keyword=${encodeURIComponent(song)}" target="_blank">DAMで検索</a></li>
          <li><a href="https://www.joysound.com/web/search/song/${encodeURIComponent(song)}" target="_blank">JOYSOUNDで検索</a></li>
        </ul>
      `;
      result.classList.add("show");
    });
  </script>
</body>
</html>
